name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Droits minimaux pour le jeton GitHub du pipeline
permissions:
  contents: read

# Une nouvelle exécution sur la même branche annule la précédente
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Job 1 : tests, couverture, analyse SonarQube et Quality Gate
  # ---------------------------------------------------------------
  test:
    name: Tests et SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code (historique complet pour SonarQube)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests avec couverture
        run: pytest --cov=app --cov-report=xml --cov-report=term

      - name: Analyse SonarQube et Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          # Le scanner attend le verdict de la Quality Gate
          # et fait échouer le job si elle n'est pas validée.
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------------
  # Job 2 : build, scan Trivy, push (une exécution par image)
  # ---------------------------------------------------------------
  build-scan-push:
    name: Build, scan et push (${{ matrix.component }})
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        component: [api, agent]

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/system-metrics-${{ matrix.component }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image (sans la pousser)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Bonus : cache des couches Docker entre deux exécutions
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scanner l'image avec Trivy
        # Épinglé sur un SHA de commit : un tag peut être déplacé
        # (cf. compromission des tags de trivy-action en mars 2026).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Pousser l'image sur Docker Hub (main uniquement)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
