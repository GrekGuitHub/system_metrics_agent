# Identifiants du projet sur SonarQube Cloud (à vérifier dans
# SonarQube Cloud > votre projet > Information)
sonar.projectKey=GrekGuitHub_system_metrics_agent
sonar.organization=grekguithub
sonar.projectName=system_metrics_agent

# Code analysé et code de test
sonar.sources=app
sonar.exclusions=app/tests/**
sonar.tests=app/tests
sonar.test.inclusions=app/tests/**

# Python et couverture de tests (générée par pytest --cov-report=xml)
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
